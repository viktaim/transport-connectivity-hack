# Базовые веса (сумма = 1)
airport_pax: 0.20          # пассажиропоток
avg_dist_to_others: 0.35   # географическая центральность
redwings_presence: 0.20    # присутствие Red Wings
population: 0.15           # население
competitor_hub: 0.10       # наличие конкурирующего хаба

# Обоснование:
# airport_pax — отражает текущую авиационную активность
# avg_dist_to_others — важно для хаба «в центре» сети
# redwings_presence — проще расти там, где уже есть присутствие
# population — потенциальный спрос
# competitor_hub — сильный конкурент снижает долю рынка
